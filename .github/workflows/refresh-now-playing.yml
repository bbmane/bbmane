name: Refresh Now Playing widget

on:
  schedule:
    - cron: '*/5 * * * *'   # ogni 5 minuti
  workflow_dispatch:          # permette anche di avviarlo a mano da GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggiorna il timestamp nell'URL dell'immagine
        run: |
          TS=$(date +%s)
          sed -i -E "s#(api/now-playing)(\?t=[0-9]+)?\)#\1?t=${TS})#g" README.md

      - name: Commit e push solo se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: forza refresh widget now playing"
          git push
